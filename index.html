<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>French Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🇫🇷 French Conversation Flashcards</h1>
    <p class="subtitle">Practice everyday French vocabulary!</p>

    <!-- XP Counter -->
    <div class="xp-container">
      <div class="xp-info">
        <span class="xp-label">⭐ XP</span>
        <span class="xp-value" id="xpValue">0</span>
        <span class="xp-level" id="xpLevel">Level 1</span>
      </div>
      <div class="xp-bar-container">
        <div class="xp-bar" id="xpBar"></div>
      </div>
      <p class="xp-next" id="xpNext">50 XP to next level</p>
    </div>
  </header>

  <main>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="progress-text" id="progressText">Card 1 of 46</p>

    <div class="card" id="flashcard">
      <div class="card-inner" id="cardInner">

        <!-- Front of card (English) -->
        <div class="card-front" id="cardFront">
          <!-- Eiffel Tower SVG top right corner -->
          <div class="eiffel-wrapper">
            <svg class="eiffel-svg" viewBox="0 0 100 200"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-label="Eiffel Tower decoration">
              <!-- Legs -->
              <line x1="20" y1="200" x2="45" y2="100" stroke="#c9748a" stroke-width="5" stroke-linecap="round"/>
              <line x1="80" y1="200" x2="55" y2="100" stroke="#c9748a" stroke-width="5" stroke-linecap="round"/>
              <!-- Lower cross brace -->
              <line x1="22" y1="170" x2="78" y2="170" stroke="#c9748a" stroke-width="4" stroke-linecap="round"/>
              <!-- Mid section -->
              <line x1="45" y1="100" x2="38" y2="60"  stroke="#c9748a" stroke-width="4" stroke-linecap="round"/>
              <line x1="55" y1="100" x2="62" y2="60"  stroke="#c9748a" stroke-width="4" stroke-linecap="round"/>
              <!-- Upper cross brace -->
              <line x1="38" y1="80"  x2="62" y2="80"  stroke="#c9748a" stroke-width="3" stroke-linecap="round"/>
              <!-- Upper section -->
              <line x1="38" y1="60"  x2="44" y2="30"  stroke="#c9748a" stroke-width="3" stroke-linecap="round"/>
              <line x1="62" y1="60"  x2="56" y2="30"  stroke="#c9748a" stroke-width="3" stroke-linecap="round"/>
              <!-- Top cross brace -->
              <line x1="44" y1="45"  x2="56" y2="45"  stroke="#c9748a" stroke-width="2.5" stroke-linecap="round"/>
              <!-- Spire -->
              <line x1="44" y1="30"  x2="50" y2="5"   stroke="#c9748a" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="56" y1="30"  x2="50" y2="5"   stroke="#c9748a" stroke-width="2.5" stroke-linecap="round"/>
              <!-- Tip dot -->
              <circle cx="50" cy="4" r="2.5" fill="#c9748a"/>
            </svg>
          </div>
          <p class="card-label">English</p>
          <p class="card-word" id="englishWord"></p>
        </div>

        <!-- Back of card (French) -->
        <div class="card-back" id="cardBack">
          <!-- Eiffel Tower SVG top right corner (lighter for dark bg) -->
          <div class="eiffel-wrapper">
            <svg class="eiffel-svg" viewBox="0 0 100 200"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-label="Eiffel Tower decoration">
              <line x1="20" y1="200" x2="45" y2="100" stroke="#f7c4d4" stroke-width="5" stroke-linecap="round"/>
              <line x1="80" y1="200" x2="55" y2="100" stroke="#f7c4d4" stroke-width="5" stroke-linecap="round"/>
              <line x1="22" y1="170" x2="78" y2="170" stroke="#f7c4d4" stroke-width="4" stroke-linecap="round"/>
              <line x1="45" y1="100" x2="38" y2="60"  stroke="#f7c4d4" stroke-width="4" stroke-linecap="round"/>
              <line x1="55" y1="100" x2="62" y2="60"  stroke="#f7c4d4" stroke-width="4" stroke-linecap="round"/>
              <line x1="38" y1="80"  x2="62" y2="80"  stroke="#f7c4d4" stroke-width="3" stroke-linecap="round"/>
              <line x1="38" y1="60"  x2="44" y2="30"  stroke="#f7c4d4" stroke-width="3" stroke-linecap="round"/>
              <line x1="62" y1="60"  x2="56" y2="30"  stroke="#f7c4d4" stroke-width="3" stroke-linecap="round"/>
              <line x1="44" y1="45"  x2="56" y2="45"  stroke="#f7c4d4" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="44" y1="30"  x2="50" y2="5"   stroke="#f7c4d4" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="56" y1="30"  x2="50" y2="5"   stroke="#f7c4d4" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="50" cy="4" r="2.5" fill="#f7c4d4"/>
            </svg>
          </div>
          <p class="card-label">French</p>
          <p class="card-word" id="frenchWord"></p>
        </div>

      </div>
    </div>

    <p class="hint-text">Click the card to flip it!</p>

    <div class="input-section">
      <label for="userAnswer">Type the French translation:</label>
      <input
        type="text"
        id="userAnswer"
        placeholder="Type your answer here..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button id="checkBtn">Check Answer</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- XP Toast Notification -->
    <div class="xp-toast" id="xpToast"></div>

    <div class="nav-buttons">
      <button id="prevBtn">⬅ Previous</button>
      <button id="nextBtn">Next ➡</button>
    </div>

    <div class="score-section" id="scoreSection" style="display:none;">
      <h2>🎉 You finished the deck!</h2>
      <p id="scoreText"></p>
      <p id="xpSummary" class="xp-summary"></p>
      <button id="restartBtn">🔄 Start Over</button>
    </div>
  </main>

  <footer>
    <p>Built for French learners 💙 | Customize the vocabulary in <code>script.js</code></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
